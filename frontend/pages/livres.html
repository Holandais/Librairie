<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Livres — Kora Librairie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-page="livres">

<button class="hamburger" id="hamburger" aria-label="Ouvrir le menu"><i class="fa-solid fa-bars"></i></button>
<div class="backdrop" id="backdrop"></div>

<div class="shell">
  <nav class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark"><i class="fa-solid fa-book-open"></i></div>
      <div class="brand-name"><b>Kora Librairie</b><span>Gestion</span></div>
    </div>

    <div class="nav" id="nav">
      <a class="nav-item" href="../index.html" data-page="dashboard"><i class="fa-solid fa-gauge-high"></i>Tableau de bord</a>
      <a class="nav-item" href="livres.html" data-page="livres"><i class="fa-solid fa-book"></i>Livres</a>
      <a class="nav-item" href="auteurs.html" data-page="auteurs"><i class="fa-solid fa-pen-nib"></i>Auteurs</a>
      <a class="nav-item" id="nav-adherents" href="adherents.html" data-page="adherents"><i class="fa-solid fa-users"></i>Adhérents</a>
      <a class="nav-item" id="nav-users" href="utilisateurs.html" data-page="users"><i class="fa-solid fa-user-shield"></i>Utilisateurs</a>
      <a class="nav-item" href="emprunts.html" data-page="emprunts"><i class="fa-solid fa-arrow-right-arrow-left"></i>Emprunts</a>
    </div>

    <div class="sidebar-user" id="sidebar-user">
      <div class="avatar"><i class="fa-solid fa-user"></i></div>
      <div class="user-meta"><b id="user-name">—</b><span id="user-role">—</span></div>
      <button class="icon-btn" id="logout" title="Se déconnecter"><i class="fa-solid fa-right-from-bracket"></i></button>
    </div>
  </nav>

  <div class="main">
    <div class="content">
      <div class="alert danger" id="global-error" hidden></div>

      <div class="page-head">
        <div><h1>Livres</h1><p>Recherche par titre ou auteur, avec pagination.</p></div>
        <button class="btn accent" id="btn-add-livre"><i class="fa-solid fa-plus"></i> Ajouter un livre</button>
      </div>
      <div class="toolbar">
        <input class="field" id="livre-search" placeholder="Rechercher par titre...">
        <input class="field" id="livre-auteur" placeholder="Filtrer par auteur...">
        <select class="field" id="livre-dispo" style="max-width:160px; flex:0;">
          <option value="">Tous statuts</option>
          <option value="true">Disponibles</option>
          <option value="false">Empruntés</option>
        </select>
        <button class="btn" id="livre-search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button class="btn" id="livre-clear" hidden>Effacer</button>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Catalogue</h2><span class="hint" id="livres-total">—</span></div>
        <div class="panel-body table-wrap">
          <table>
            <thead><tr><th>Titre</th><th>Auteur</th><th class="num">Année</th><th>Statut</th><th></th></tr></thead>
            <tbody id="livres-body"></tbody>
          </table>
        </div>
        <div class="panel-body" style="padding-top:0">
          <div class="pagination">
            <button class="btn" id="livres-prev"><i class="fa-solid fa-chevron-left"></i> Précédent</button>
            <span class="info" id="livres-page-info">Page 1 / 1</span>
            <button class="btn" id="livres-next">Suivant <i class="fa-solid fa-chevron-right"></i></button>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <div class="modal-head"><h2 id="modal-title">Formulaire</h2><button class="icon-btn" id="modal-close"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/toast.js"></script>
<script src="../assets/js/livres.js"></script>
</body>
</html>
